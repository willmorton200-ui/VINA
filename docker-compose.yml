version: '3.8'

services:
  vina-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vina-scanner
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - VINA_MATCHER_MODE=hybrid
    volumes:
      - ./app.py:/app/app.py
      - ./models:/app/models
      - ./wines_integrated_clean.csv:/app/wines_integrated_clean.csv
      - ./wines_images_clean:/app/wines_images_clean
      - ./pipeline:/app/pipeline
      - ./sommelier:/app/sommelier
      - ./static:/app/static
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
